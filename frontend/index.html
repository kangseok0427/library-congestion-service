<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>용산꿈나무도서관 · 언제 가면 한산할까</title>
<link rel="stylesheet" href="/static/style.css">
<script defer src="/static/api.js"></script>
<script defer src="/static/app.js"></script>
</head>
<body>
<main>
  <header class="top">
    <p class="library" id="library">용산꿈나무도서관</p>
    <h1>언제 가면 한산할까</h1>
    <form id="date-form" class="date-row">
      <label for="date">날짜</label>
      <input type="date" id="date" required>
      <button type="submit">조회</button>
      <button type="button" id="refresh" class="ghost">새로고침</button>
    </form>
    <p class="hint">오늘부터 7일 후까지 볼 수 있습니다.</p>
  </header>

  <p id="error" class="error" role="alert" hidden></p>
  <p id="sample" class="banner" hidden>합성 샘플 데이터로 보는 예시입니다. 실제 도서관 수치가 아닙니다.</p>

  <!-- ADE-49: 방문 안내 멘트. 휴관일·자료 부족도 여기서 글로 알립니다. -->
  <section class="guide" id="guide" data-state="loading" aria-live="polite">
    <p class="guide-when" id="guide-when">불러오는 중</p>
    <p class="guide-title" id="guide-title" hidden></p>
    <p class="guide-message" id="guide-message"></p>
  </section>

  <!-- ADE-49: 시간대별 막대. 높이 = estimated_present, 색 = API level -->
  <section class="hours" id="hours" aria-labelledby="hours-title">
    <h2 id="hours-title">시간대별 혼잡도</h2>
    <div id="chart" class="chart" role="group" aria-label="시간대별 혼잡도 막대"></div>
    <ul class="legend"><li class="quiet">여유</li><li class="normal">보통</li><li class="busy">혼잡</li><li class="none">자료 부족</li></ul>
    <p class="detail" id="detail" aria-live="polite">막대를 누르면 그 시간대 상태가 보입니다.</p>
    <p class="basis" id="basis">막대 높이는 과거 자료로 추정한 체류 인원입니다. 정확한 실시간 인원이나 좌석 점유율이 아닙니다.</p>
  </section>

  <footer>
    <p id="updated"></p>
    <p id="hours-note"></p>
  </footer>
</main>
</body>
</html>
