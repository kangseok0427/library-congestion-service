openapi: 3.0.3
info:
  title: Library admin cloud transport extension
  version: 3.0.0
  description: Adds direct Storage upload to v2. Existing login/version/rollback response shapes remain unchanged. Neon login uses an administrator email in username. Before the first upload the cloud version list permits null active_version_id and an empty versions array.
paths:
  /api/v1/admin/upload-mode:
    get:
      responses:
        '200':
          description: Authenticated cloud transport discovery
          content:
            application/json:
              schema:
                type: object
                required: [mode, max_upload_bytes]
                properties:
                  mode: {type: string, enum: [neon-direct]}
                  max_upload_bytes: {type: integer, enum: [10485760]}
  /api/v1/admin/uploads/sign:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filename, size]
              properties:
                filename: {type: string, maxLength: 240}
                size: {type: integer, minimum: 1, maximum: 10485760}
      responses:
        '200':
          description: One private PUT URL, valid for 300 seconds and bound to the declared Content-Length and XLSX Content-Type. A URL can be reused until expiry; publishing the same upload_id replays the committed result. Never a service secret.
          content:
            application/json:
              schema:
                type: object
                required: [upload_id, upload_url]
                properties:
                  upload_id: {type: string, format: uuid}
                  upload_url: {type: string, format: uri}
  /api/v1/admin/uploads/publish:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [upload_id]
              properties:
                upload_id: {type: string, format: uuid}
      responses:
        '200':
          description: Completed processing, or replay of an already completed upload
          content:
            application/json:
              schema:
                $ref: './openapi-v2.yaml#/components/schemas/UploadPublished'
